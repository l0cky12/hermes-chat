<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Scripts come only from the app's own files, so injected markup can't run any. The page talks only to Tauri's
         IPC and GitHub (update checks). Frames (the preview pane's web pages) may load only http(s) pages, never the
         app's own tauri: or ipc: origins. Tauri's CSP stays off (tauri.conf.json). See docs/adr/0007 and 0100. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self'; connect-src 'self' ipc: http://ipc.localhost https://api.github.com; frame-src http: https:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Hermes Chat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
