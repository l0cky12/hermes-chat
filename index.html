<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Frames (the preview pane's web pages) may load only http(s) pages, never the app's own tauri: or ipc: origins.
         No image or sound loads from the network, since a mermaid diagram is laid out in the page before it is cleaned.
         Tauri's CSP stays off (tauri.conf.json). See docs/adr/0007, docs/adr/0129 and docs/adr/0136. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self'; connect-src 'self' ipc: http://ipc.localhost https://api.github.com; img-src 'self' data: blob:; media-src 'self' data: blob:; frame-src http: https:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Hermes Chat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
