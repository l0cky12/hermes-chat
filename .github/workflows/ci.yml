name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: scripts/release/windows-release.test.sh
      - name: Every version file says the same version
        run: node scripts/release/version.mjs check

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libdbus-1-dev xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri::generate_context! needs frontendDist (../dist) to exist at compile time.
      - run: mkdir -p dist
      - run: cargo test --lib --test transport --test proxy --test media --test screenshot --test update
        working-directory: src-tauri
      # Pastes into a WebKitGTK view, on a display of its own because it empties the clipboard.
      - run: xvfb-run -a cargo test --test clipboard -- --ignored
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo fmt --check
        working-directory: src-tauri
