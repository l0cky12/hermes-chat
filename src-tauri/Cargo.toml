[package]
name = "hermes-chat"
version = "0.1.3"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "hermes_chat"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon`: the tray icon and its menu (tray.rs); `image-png`: its icon, from the bundled PNG.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "time", "sync", "fs", "io-util"] }
# TLS through the system's OpenSSL and trust store, so https:// and wss:// dashboards (such as one behind
# Cloudflare Access) work.
# `multipart` and `stream`: Server files uploads stream a local file into `POST /api/files/upload-stream` (ADR 0023).
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "multipart", "stream"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
thiserror = "2"
url = "2"
# Already in the tree (through tauri): hashes a Hermes install id before it is kept, to tell servers apart (ADR 0056).
sha2 = "0.10"
# Comes with url; decodes a relayed path the way the dashboard will before routing it.
percent-encoding = "2"
base64 = "0.22"
# Already in the tree (through tauri-plugin-updater): deflates the Repository helper so it fits one ssh argument (repo_git.rs).
flate2 = "1"
tauri-plugin-dialog = "2"
# Already comes with tauri-plugin-updater, without compression: backups are zips of stored JSON files (backup.rs).
zip = { version = "9", default-features = false }
# Verified self-updates for a standalone AppImage built with an update key (update.rs). Never used on a pacman install.
tauri-plugin-updater = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
# Both already come with keyring and tauri; used directly for desktop notifications (notify.rs).
dbus = "0.9"
gtk = "0.18"
# Already comes with gtk; `v2_58` starts the default browser with its error output kept (browser.rs).
gio = { version = "0.18", features = ["v2_58"] }
# Both already come with tauri; used to ask whether an X11 desktop has an XEmbed tray (tray.rs).
gdkx11 = "0.18"
x11 = { version = "2.21", features = ["xlib"] }
# Already comes with tauri (wry turns on `v2_40`); used to turn on WebKitGTK's media capture for dictation.
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
# The Terminal's pseudo-terminal on Windows is ConPTY (terminal.rs); Linux keeps openpty.
portable-pty = "0.9"
# Already comes with tokio and tauri. Job objects so ssh ends with the app (server_page.rs), which process holds a
# tunnel's port (loopback_owner.rs), whether a captures folder's pid is still Hermes Chat (screenshot.rs), the installed
# fonts (fonts.rs), opening a page in the browser (web_page.rs), and where the touch keyboard is (touch_keyboard.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Already comes with tauri (tao, wry, webview2-com): WinRT toasts are the desktop notifications on Windows (notify.rs).
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
# `tauri::test`, a mock runtime for tests/update.rs. The feature adds no crate.
tauri = { version = "2", features = ["test"] }
